services:
  fantasy_store_local:
    build: .
    container_name: fantasy_store_local
    volumes:
      - .:/app
    ports:
      - "8005:8005"
    env_file:
      - .env
    depends_on:
      - fantasy_mongodb_local
    # For localhost
    # command: sleep infinity
    command: uvicorn main:app --host 0.0.0.0 --port 8005
    restart: unless-stopped
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  fantasy_mongodb_local:
      image: mongo:latest
      container_name: fantasy_mongodb_local
      volumes:
        - ./docker_volumes/mongodb:/data/db
      environment:
      - ../.env.db
      ports:
        - "27017:27017"
